<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="检索中国人民大学相关站点，并根据官网资料生成回答。">
  <title>ζengine</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0%200%2064%2064'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23d97757'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='serif' font-size='46' font-weight='700' fill='%23f3eee7'%3E%CE%B6%3C/text%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    ::selection { color: #fffaf4; background: #d97757; }
    :root {
      color: #191918;
      background: #f3eee7;
      font-family: Arial, "Noto Sans SC", sans-serif;
      font-synthesis: none;
    }
    body { min-height: 100vh; margin: 0; }
    main {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      padding: 21vh 0 80px;
      transition: padding 180ms ease;
    }
    main.has-results { padding-top: 42px; }
    h1 {
      margin: 0 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.2rem, 9vw, 5.6rem);
      font-weight: 400;
      letter-spacing: -.07em;
      text-align: center;
    }
    h1 a { color: inherit; text-decoration: none; }
    h1 span { color: #d97757; }
    .tagline {
      margin: 0 0 32px;
      color: #756f67;
      font-size: .88rem;
      letter-spacing: .04em;
      text-align: center;
    }
    .has-results h1 { margin-bottom: 18px; font-size: 2.5rem; text-align: left; }
    .has-results .tagline { display: none; }
    form {
      display: flex;
      align-items: center;
      min-height: 72px;
      padding: 7px 8px 7px 22px;
      border: 1px solid #958e85;
      border-radius: 5px;
      background: #faf7f2;
      box-shadow: 8px 8px 0 #dfd7cc;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }
    form:focus-within {
      border-color: #191918;
      box-shadow: 11px 11px 0 #dfd7cc;
      transform: translate(-2px, -2px);
    }
    input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      color: inherit;
      background: transparent;
      font: inherit;
      font-size: 1.05rem;
    }
    input::placeholder { color: #8f8981; opacity: 1; }
    button { font: inherit; }
    .search-button {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 0;
      border-radius: 3px;
      color: #f3eee7;
      background: #191918;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease;
    }
    .search-button:hover { background: #d97757; }
    .search-button:active { transform: scale(.94); }
    .search-button:focus-visible, .answer-button:focus-visible, .retry-button:focus-visible {
      outline: 3px solid #d97757;
      outline-offset: 3px;
    }
    button:disabled { cursor: wait; opacity: .55; }
    svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-width: 2;
    }
    #status {
      min-height: 24px;
      margin: 34px 2px 10px;
      color: #625e57;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .06em;
    }
    #answer-offer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      margin: 12px 0 28px;
      padding: 20px 22px;
      border: 1px solid #d7c0b3;
      border-radius: 5px;
      background: #f8e9df;
    }
    #answer-offer[hidden], #answer[hidden], #empty-state[hidden] { display: none; }
    .offer-copy { min-width: 0; }
    .offer-title { margin: 0 0 5px; font-family: Georgia, "Noto Serif SC", serif; font-size: 1.06rem; }
    .offer-detail { margin: 0; color: #75675f; font-size: .78rem; line-height: 1.5; }
    .answer-button {
      flex: 0 0 auto;
      padding: 10px 14px;
      border: 1px solid #bd6247;
      border-radius: 3px;
      color: #8b3e29;
      background: transparent;
      cursor: pointer;
      font-size: .82rem;
      font-weight: 700;
    }
    .answer-button:hover { color: #fffaf4; background: #bd6247; }
    #answer { position: relative; margin: 12px 0 30px; padding: 32px 40px; background: #faf7f2; box-shadow: inset 0 0 0 1px #dfd7cc; }
    #answer::before, #answer::after {
      position: absolute;
      width: 12px;
      height: 24px;
      content: "";
      pointer-events: none;
    }
    #answer::before {
      top: 12px;
      left: 12px;
      border-top: 1.5px solid #d97757;
      border-left: 1.5px solid #d97757;
    }
    #answer::after {
      right: 12px;
      bottom: 12px;
      border-right: 1.5px solid #d97757;
      border-bottom: 1.5px solid #d97757;
    }
    .answer-label { margin: 0 0 12px; color: #9b4a34; font-size: .72rem; font-weight: 700; letter-spacing: .08em; }
    #answer-text { margin: 0; color: #2d2b28; font-family: Georgia, "Times New Roman", "Noto Serif SC", serif; line-height: 1.8; white-space: pre-wrap; }
    #answer-status { margin: 12px 0 0; color: #756f67; font-size: .75rem; }
    #results { margin: 0; padding: 0; list-style: none; }
    .result { padding: 23px 2px 25px; border-top: 1px solid #c9c1b7; }
    .result a {
      display: -webkit-box;
      overflow: hidden;
      color: #191918;
      font-family: Georgia, "Times New Roman", "Noto Serif SC", serif;
      font-size: 1.32rem;
      font-weight: 400;
      line-height: 1.4;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .result a:hover { color: #d45f3b; }
    .source { margin: 8px 0 10px; overflow: hidden; color: #8b4a35; font-size: .74rem; text-overflow: ellipsis; white-space: nowrap; }
    .snippet {
      display: -webkit-box;
      margin: 0;
      overflow: hidden;
      color: #625e57;
      font-family: Georgia, "Times New Roman", "Noto Serif SC", serif;
      line-height: 1.65;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;
    }
    #empty-state { margin: 16px 0; padding: 24px; border-top: 1px solid #c9c1b7; color: #625e57; line-height: 1.7; }
    #empty-state p { margin: 0 0 10px; }
    .retry-button { padding: 0; border: 0; color: #9b4a34; background: none; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .error { color: #b64a35 !important; }
    @media (max-width: 520px) {
      main { width: min(100% - 28px, 760px); padding-top: 19vh; }
      main.has-results { padding-top: 24px; }
      .has-results h1 { text-align: center; }
      form { min-height: 66px; padding: 7px 7px 7px 17px; box-shadow: 6px 6px 0 #dfd7cc; }
      form:focus-within { box-shadow: 8px 8px 0 #dfd7cc; }
      .search-button { width: 50px; height: 50px; }
      #answer-offer { align-items: flex-start; gap: 14px; padding: 17px 16px; }
      .offer-detail { display: none; }
      .answer-button { padding: 9px 11px; }
      #answer { padding: 30px; }
      .result { padding: 21px 2px 23px; }
      .result a { font-size: 1.25rem; }
      .snippet { -webkit-line-clamp: 3; }
    }
    @media (prefers-reduced-motion: reduce) { main, form, .search-button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1><a href="/" aria-label="返回首页"><span>ζ</span>engine</a></h1>
    <p class="tagline">检索中国人民大学相关站点</p>
    <form id="search-form" role="search">
      <input id="query" name="q" aria-label="搜索" placeholder="搜索人大官网、招生政策、办事信息…" autocomplete="off" autofocus required>
      <button class="search-button" type="submit" aria-label="搜索">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m14 7 5 5-5 5"></path></svg>
      </button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <aside id="answer-offer" aria-label="智能回答" hidden>
      <div class="offer-copy">
        <p class="offer-title">想直接获得整理后的回答？</p>
        <p class="offer-detail">根据官网资料生成，并保留参考来源</p>
      </div>
      <button class="answer-button" type="button">✦ 生成回答</button>
    </aside>

    <section id="answer" aria-label="根据官网资料生成的回答" hidden>
      <p class="answer-label">根据官网资料生成</p>
      <p id="answer-text"></p>
      <p id="answer-status" role="status" aria-live="polite"></p>
    </section>

    <section id="empty-state" hidden>
      <p>没有找到相关网页。可以尝试缩短关键词，或换一种说法。</p>
      <button class="retry-button" type="button">重新编辑搜索内容</button>
    </section>
    <ol id="results"></ol>
  </main>

  <script>
    const main = document.querySelector("main");
    const form = document.querySelector("form");
    const input = document.querySelector("input");
    const searchButton = document.querySelector(".search-button");
    const status = document.querySelector("#status");
    const offer = document.querySelector("#answer-offer");
    const answerButton = document.querySelector(".answer-button");
    const answer = document.querySelector("#answer");
    const answerText = document.querySelector("#answer-text");
    const answerStatus = document.querySelector("#answer-status");
    const emptyState = document.querySelector("#empty-state");
    const retryButton = document.querySelector(".retry-button");
    const list = document.querySelector("#results");
    let activeController = null;
    let requestSequence = 0;

    function sourceLabel(rawUrl) {
      try {
        return new URL(rawUrl).hostname.replace(/^www\./, "");
      } catch {
        return rawUrl;
      }
    }

    function showResults(results) {
      list.replaceChildren(...results.map(result => {
        const item = document.createElement("li");
        item.className = "result";
        const link = document.createElement("a");
        link.href = result.url;
        link.textContent = result.title || result.url;
        const source = document.createElement("p");
        source.className = "source";
        source.textContent = sourceLabel(result.url);
        source.title = result.url;
        const snippet = document.createElement("p");
        snippet.className = "snippet";
        snippet.textContent = result.snippet || "";
        item.append(link, source, snippet);
        return item;
      }));
    }

    function beginRequest() {
      activeController?.abort();
      activeController = new AbortController();
      requestSequence += 1;
      return { controller: activeController, sequence: requestSequence };
    }

    function resetHome() {
      activeController?.abort();
      requestSequence += 1;
      main.classList.remove("has-results");
      input.value = "";
      status.textContent = "";
      status.className = "";
      offer.hidden = true;
      answer.hidden = true;
      emptyState.hidden = true;
      list.replaceChildren();
      searchButton.disabled = false;
      answerButton.disabled = false;
    }

    async function search(query, { updateHistory = true } = {}) {
      const { controller, sequence } = beginRequest();
      main.classList.add("has-results");
      status.className = "";
      status.textContent = "正在查找官网资料…";
      offer.hidden = true;
      answer.hidden = true;
      emptyState.hidden = true;
      list.replaceChildren();
      searchButton.disabled = true;
      answerButton.disabled = false;
      if (updateHistory) history.pushState({}, "", `?q=${encodeURIComponent(query)}`);

      try {
        const response = await fetch(`/api/search?q=${encodeURIComponent(query)}&ranking=rerank`, { signal: controller.signal });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "搜索失败");
        if (sequence !== requestSequence) return;
        status.textContent = data.count ? `找到 ${data.count} 条相关结果` : "没有找到相关结果";
        showResults(data.results);
        offer.hidden = !data.count;
        emptyState.hidden = Boolean(data.count);
      } catch (error) {
        if (error.name === "AbortError" || sequence !== requestSequence) return;
        status.className = "error";
        status.textContent = error.message;
      } finally {
        if (sequence === requestSequence) searchButton.disabled = false;
      }
    }

    async function generateAnswer({ updateHistory = true } = {}) {
      const query = input.value.trim();
      if (!query) return;
      const { controller, sequence } = beginRequest();
      offer.hidden = true;
      answer.hidden = false;
      answerText.textContent = "";
      answerStatus.className = "";
      answerStatus.textContent = "正在阅读并整理官网资料…";
      answerButton.disabled = true;
      if (updateHistory) history.pushState({}, "", `?q=${encodeURIComponent(query)}&view=answer`);

      try {
        const response = await fetch(`/api/search?q=${encodeURIComponent(query)}&ranking=rag`, { signal: controller.signal });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "暂时无法生成回答");
        if (sequence !== requestSequence) return;
        answerText.textContent = data.answer || "暂时没有足够资料生成回答。";
        answerStatus.textContent = data.count ? `参考了 ${data.count} 条官网来源` : "";
        if (data.results?.length) showResults(data.results);
        status.textContent = data.count ? `参考来源 · ${data.count} 条` : "参考来源";
      } catch (error) {
        if (error.name === "AbortError" || sequence !== requestSequence) return;
        answerStatus.className = "error";
        answerStatus.textContent = error.message;
        offer.hidden = false;
      } finally {
        if (sequence === requestSequence) answerButton.disabled = false;
      }
    }

    async function restoreLocation() {
      const parameters = new URLSearchParams(location.search);
      const query = parameters.get("q")?.trim();
      if (!query) {
        resetHome();
        return;
      }
      input.value = query;
      await search(query, { updateHistory: false });
      if (parameters.get("view") === "answer") await generateAnswer({ updateHistory: false });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const query = input.value.trim();
      if (query) search(query);
    });
    answerButton.addEventListener("click", () => generateAnswer());
    retryButton.addEventListener("click", () => input.focus());
    window.addEventListener("popstate", restoreLocation);
    restoreLocation();
  </script>
</body>
</html>
