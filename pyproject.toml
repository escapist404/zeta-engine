[project]
name = "zeta-engine"
version = "0.1.0"
description = "Chinese site search and retrieval-augmented generation engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "huggingface-hub>=1.29.0",
    "jieba>=0.42.1",
    "numpy>=2.5.2",
    "openai>=3.5.0",
    "requests>=2.34.2",
    "resiliparse>=1.0.9",
    "sentence-transformers>=6.0.0",
    "url-normalize>=3.0.0",
]

[dependency-groups]
dev = ["ipykernel>=7.3.0"]

[project.scripts]
zeta-engine = "zeta_engine.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
