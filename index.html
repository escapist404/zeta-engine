<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ζ-engine</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: #171717;
      background: #f7f7f4;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(620px, calc(100% - 40px));
      transform: translateY(-9vh);
    }

    h1 {
      margin: 0 0 30px;
      font-size: clamp(2.8rem, 8vw, 5.2rem);
      font-weight: 500;
      letter-spacing: -0.075em;
      text-align: center;
    }

    form {
      display: flex;
      align-items: center;
      height: 58px;
      padding: 0 8px 0 22px;
      border: 1px solid #deded8;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 12px 30px rgb(0 0 0 / 5%);
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    form:focus-within {
      border-color: #a9a9a1;
      box-shadow: 0 16px 40px rgb(0 0 0 / 8%);
      transform: translateY(-1px);
    }

    input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      color: inherit;
      background: transparent;
      font: inherit;
      font-size: 1.05rem;
    }

    button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: #171717;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease;
    }

    button:hover { background: #333; }
    button:active { transform: scale(.94); }
    button:focus-visible { outline: 3px solid #bcbcb5; outline-offset: 3px; }

    svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-width: 2;
    }

    @media (prefers-reduced-motion: reduce) {
      form, button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>ζ-engine</h1>
    <form action="https://www.google.com/search" method="get">
      <input name="q" aria-label="搜索" autocomplete="off" autofocus required>
      <button type="submit" aria-label="提交搜索">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m16.5 16.5 4 4"></path>
        </svg>
      </button>
    </form>
  </main>
</body>
</html>
